<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공부 타이머 - Firebase 연결</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 18px; line-height: 1.6; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 18px; margin: 14px 0; }
    .status { font-weight: 700; }
    .muted { color: #666; font-size: .94rem; }
  </style>
</head>
<body>
  <h1>공부 타이머 Firebase 연결</h1>
  <p class="muted">이 파일은 Timer와 Timer2의 Firebase 연결을 확인하는 기본 템플릿입니다.</p>

  <section class="card">
    <h2>Timer (메인)</h2>
    <p id="timer-status" class="status">연결 확인 중...</p>
  </section>

  <section class="card">
    <h2>Timer2 (두 번째 프로젝트)</h2>
    <p id="timer2-status" class="status">연결 확인 중...</p>
  </section>

  <p class="muted">
    참고: 이 템플릿은 Firebase 앱과 Firestore를 초기화합니다.
    기존 공부 타이머의 로그인, 학생 등록, 시간 저장 기능은 포함하지 않습니다.
    실제 데이터 사용 전 각 프로젝트의 Firestore 보안 규칙과 Authentication 설정을 확인하세요.
  </p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    // Timer - 메인 Firebase 프로젝트
    const timerConfig = {
      apiKey: "AIzaSyAZKP-6cA0Sk52U3PyRnykuGk0uphuAIpk",
      authDomain: "timer-86a08.firebaseapp.com",
      projectId: "timer-86a08",
      storageBucket: "timer-86a08.firebasestorage.app",
      messagingSenderId: "643557583956",
      appId: "1:643557583956:web:0918a218cf837e961091c1",
      measurementId: "G-6XCZNTTVWM"
    };

    // Timer2 - 두 번째 Firebase 프로젝트
    const timer2Config = {
      apiKey: "AIzaSyAwoIy7t6aw0zsZewg1xZSTzjQ04nTMozU",
      authDomain: "timer2-39b21.firebaseapp.com",
      projectId: "timer2-39b21",
      storageBucket: "timer2-39b21.firebasestorage.app",
      messagingSenderId: "39378832324",
      appId: "1:39378832324:web:0bb5efb6f7f09ddfdb3291",
      measurementId: "G-Y5ZFZH65VJ"
    };

    try {
      const timerApp = initializeApp(timerConfig, "Timer");
      const timerDb = getFirestore(timerApp);
      document.getElementById("timer-status").textContent =
        "Firebase 앱 및 Firestore 초기화 완료 (timer-86a08)";
      window.timerDb = timerDb;
    } catch (error) {
      document.getElementById("timer-status").textContent =
        "연결 오류: " + error.message;
      console.error("Timer 초기화 오류:", error);
    }

    try {
      const timer2App = initializeApp(timer2Config, "Timer2");
      const timer2Db = getFirestore(timer2App);
      document.getElementById("timer2-status").textContent =
        "Firebase 앱 및 Firestore 초기화 완료 (timer2-39b21)";
      window.timer2Db = timer2Db;
    } catch (error) {
      document.getElementById("timer2-status").textContent =
        "연결 오류: " + error.message;
      console.error("Timer2 초기화 오류:", error);
    }
  </script>
</body>
</html>
